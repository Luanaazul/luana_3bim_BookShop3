<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BookShop | Menu</title>

    <link
        rel="stylesheet"
        href="../css/menu.css"
    >

</head>


<body class="menu-page">


    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="site-header">

        <div class="header-content">

            <h1 class="site-title">
                BOOKSHOP
            </h1>

            <p class="site-subtitle">
                sonhos dourados como a alvorada
            </p>

        </div>

    </header>


    <!-- =====================================================
         NAVEGAÇÃO
         ===================================================== -->

    <nav
        class="menu-nav"
        aria-label="Menu principal"
    >

        <ul class="menu-links">

            <li>
                <a
                    class="menu-link"
                    href="../livros/livros.html"
                >
                    LIVROS
                </a>
            </li>

            <li>
                <a
                    class="menu-link"
                    href="../lancamentos/lancamentos.html"
                >
                    LANÇAMENTOS
                </a>
            </li>

            <li>
                <a
                    class="menu-link"
                    href="../cargos/cargos.html"
                >
                    CARGOS
                </a>
            </li>

            <li>
                <a
                    class="menu-link"
                    href="../pessoas/pessoas.html"
                >
                    PESSOAS
                </a>
            </li>

        </ul>

    </nav>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->

    <main class="menu-main">


        <!-- =================================================
             CARROSSEL
             ================================================= -->

        <section
            class="menu-carousel"
            aria-label="Imagens da BookShop"
        >

            <!-- IMAGEM ATUAL -->

            <img
                id="carousel-image"
                class="menu-carousel-image"
                src="../../imagens/menu1.jpe"
                alt="Imagem da BookShop"
            >


            <!-- SETA ESQUERDA -->

            <button
                id="carousel-prev"
                class="carousel-button carousel-prev"
                type="button"
                aria-label="Imagem anterior"
            >
                ‹
            </button>


            <!-- SETA DIREITA -->

            <button
                id="carousel-next"
                class="carousel-button carousel-next"
                type="button"
                aria-label="Próxima imagem"
            >
                ›
            </button>


            <!-- INDICADORES -->

            <div
                id="carousel-indicators"
                class="carousel-indicators"
                aria-label="Imagens do carrossel"
            >

                <button
                    class="carousel-indicator active"
                    type="button"
                    aria-label="Imagem 1"
                ></button>

                <button
                    class="carousel-indicator"
                    type="button"
                    aria-label="Imagem 2"
                ></button>

                <button
                    class="carousel-indicator"
                    type="button"
                    aria-label="Imagem 3"
                ></button>

            </div>

        </section>


    </main>


    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <footer class="site-footer">

        <p>
            DW1 2026 • Luana Cazarin • 3º Projeto
        </p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="../js/menu.js"></script>

</body>

</html>
